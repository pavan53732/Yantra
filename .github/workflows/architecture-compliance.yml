name: Repository Canonicalization Validation

on:
  pull_request:
    paths:
      - '01_FOUNDATION/**'
      - '02_SPECIFICATIONS/**'
      - '03_IMPLEMENTATION/**'
      - '04_GOVERNANCE/**'
      - '.ai/**'
      - 'missions/**'
      - 'repository.manifest.json'
      - 'repository.ownership.json'
      - 'tools/spec_compiler.py'
  push:
    branches: [ main ]
    paths:
      - '01_FOUNDATION/**'
      - '02_SPECIFICATIONS/**'
      - '03_IMPLEMENTATION/**'
      - '04_GOVERNANCE/**'
      - '.ai/**'
      - 'missions/**'
      - 'repository.manifest.json'
      - 'repository.ownership.json'
      - 'tools/spec_compiler.py'

jobs:
  canonicalization:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run repository-aware compiler
        run: python tools/spec_compiler.py
      - name: Upload canonicalization report
        uses: actions/upload-artifact@v4
        with:
          name: canonicalization-report
          path: output/phase-1-1-canonicalization-report.json
