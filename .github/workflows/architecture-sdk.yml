name: architecture-sdk

on:
  push:
    paths:
      - '02_SPECIFICATIONS/**'
      - 'packages/sdk/**'
      - 'tools/generate_architecture_sdk.py'
      - '.github/workflows/architecture-sdk.yml'
  pull_request:
    paths:
      - '02_SPECIFICATIONS/**'
      - 'packages/sdk/**'
      - 'tools/generate_architecture_sdk.py'
      - '.github/workflows/architecture-sdk.yml'

jobs:
  sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate SDK
        run: python tools/generate_architecture_sdk.py
      - name: Verify generated package files exist
        run: |
          test -f packages/sdk/package.json
          test -f packages/sdk/src/index.ts
          test -f packages/sdk/src/generated/spec-index.json
          test -f output/architecture-sdk-report.json
